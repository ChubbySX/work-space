<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>写实纸箱 v2 — 信箱式窄缝</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #f7f0e7; font-family: system-ui, sans-serif; padding: 40px; }
h1 { color: #333; margin-bottom: 20px; font-size: 1.3rem; }
.row { display: flex; gap: 36px; flex-wrap: wrap; align-items: flex-start; }
.col { text-align: center; }
.col h3 { margin-top: 10px; color: #a6531f; font-size: .92rem; }
.col p { font-size: .76rem; color: #888; margin-top: 4px; max-width: 170px; line-height: 1.4; }
.box-wrap { width: 150px; height: 150px; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<h1>写实纸箱 · 信箱式窄缝开口</h1>
<div class="row">

<!-- C1: 经典信箱缝 -->
<div class="col">
<div class="box-wrap">
<svg viewBox="0 0 140 130" width="135" height="125">
  <ellipse cx="70" cy="125" rx="52" ry="5" fill="rgba(0,0,0,.12)"/>
  <rect x="15" y="28" width="80" height="85" fill="#c9a063" stroke="#7a5830" stroke-width="2" rx="2"/>
  <!-- 右侧面 -->
  <path d="M95 28 L118 20 L118 106 L95 113 Z" fill="#b8895a" stroke="#7a5830" stroke-width="2"/>
  <!-- 顶面 -->
  <path d="M15 28 L95 28 L118 20 L38 20 Z" fill="#d4b07a" stroke="#7a5830" stroke-width="2"/>
  <!-- 信箱式窄缝开口 -->
  <rect x="92" y="45" width="10" height="55" fill="#1a1208" rx="1"/>
  <rect x="92" y="44" width="10" height="3" fill="#0d0805"/>
  <!-- 瓦楞纹 -->
  <line x1="20" y1="45" x2="90" y2="45" stroke="#a07840" stroke-width=".5" opacity=".15"/>
  <line x1="20" y1="60" x2="90" y2="60" stroke="#a07840" stroke-width=".5" opacity=".15"/>
  <line x1="20" y1="75" x2="90" y2="75" stroke="#a07840" stroke-width=".5" opacity=".15"/>
  <line x1="20" y1="90" x2="90" y2="90" stroke="#a07840" stroke-width=".5" opacity=".15"/>
  <!-- 胶带 -->
  <rect x="53" y="20" width="3" height="93" fill="#e0c898" opacity=".4" stroke="#7a5830" stroke-width=".5" stroke-dasharray="2 2"/>
</svg>
</div>
<h3>C1. 经典信箱缝</h3>
<p>正面+右侧面+顶面，右侧窄缝开口，瓦楞纹+胶带</p>
</div>

<!-- C2: 带投递口盖板 -->
<div class="col">
<div class="box-wrap">
<svg viewBox="0 0 140 130" width="135" height="125">
  <ellipse cx="70" cy="125" rx="52" ry="5" fill="rgba(0,0,0,.12)"/>
  <rect x="15" y="28" width="80" height="85" fill="#c9a063" stroke="#7a5830" stroke-width="2" rx="2"/>
  <path d="M95 28 L118 20 L118 106 L95 113 Z" fill="#b8895a" stroke="#7a5830" stroke-width="2"/>
  <path d="M15 28 L95 28 L118 20 L38 20 Z" fill="#d4b07a" stroke="#7a5830" stroke-width="2"/>
  <!-- 窄缝 + 上方小翻盖 -->
  <rect x="92" y="48" width="10" height="48" fill="#1a1208" rx="1"/>
  <path d="M92 48 L102 48 L106 42 L96 42 Z" fill="#b8895a" stroke="#7a5830" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- 瓦楞纹 -->
  <line x1="20" y1="45" x2="90" y2="45" stroke="#a07840" stroke-width=".5" opacity=".15"/>
  <line x1="20" y1="60" x2="90" y2="60" stroke="#a07840" stroke-width=".5" opacity=".15"/>
  <line x1="20" y1="75" x2="90" y2="75" stroke="#a07840" stroke-width=".5" opacity=".15"/>
  <line x1="20" y1="90" x2="90" y2="90" stroke="#a07840" stroke-width=".5" opacity=".15"/>
  <!-- 胶带 -->
  <rect x="53" y="20" width="3" height="93" fill="#e0c898" opacity=".4" stroke="#7a5830" stroke-width=".5" stroke-dasharray="2 2"/>
  <!-- 标签 -->
  <rect x="35" y="55" width="22" height="14" fill="none" stroke="#7a5830" stroke-width=".8" opacity=".25" rx="1"/>
  <line x1="38" y1="60" x2="54" y2="60" stroke="#7a5830" stroke-width=".5" opacity=".2"/>
  <line x1="38" y1="64" x2="50" y2="64" stroke="#7a5830" stroke-width=".5" opacity=".2"/>
</svg>
</div>
<h3>C2. 带投递口盖板</h3>
<p>窄缝上方有上翻的小盖板，像信箱投递口</p>
</div>

<!-- C3: 横向投递缝 -->
<div class="col">
<div class="box-wrap">
<svg viewBox="0 0 140 130" width="135" height="125">
  <ellipse cx="70" cy="125" rx="52" ry="5" fill="rgba(0,0,0,.12)"/>
  <rect x="15" y="28" width="80" height="85" fill="#c9a063" stroke="#7a5830" stroke-width="2" rx="2"/>
  <path d="M95 28 L118 20 L118 106 L95 113 Z" fill="#b8895a" stroke="#7a5830" stroke-width="2"/>
  <path d="M15 28 L95 28 L118 20 L38 20 Z" fill="#d4b07a" stroke="#7a5830" stroke-width="2"/>
  <!-- 横向窄缝 -->
  <rect x="30" y="50" width="55" height="6" fill="#1a1208" rx="1"/>
  <rect x="30" y="49" width="55" height="2" fill="#0d0805"/>
  <!-- 瓦楞纹 -->
  <line x1="20" y1="70" x2="90" y2="70" stroke="#a07840" stroke-width=".5" opacity=".15"/>
  <line x1="20" y1="85" x2="90" y2="85" stroke="#a07840" stroke-width=".5" opacity=".15"/>
  <line x1="20" y1="100" x2="90" y2="100" stroke="#a07840" stroke-width=".5" opacity=".15"/>
  <!-- 胶带 -->
  <rect x="53" y="20" width="3" height="93" fill="#e0c898" opacity=".4" stroke="#7a5830" stroke-width=".5" stroke-dasharray="2 2"/>
  <!-- 标签 -->
  <rect x="35" y="75" width="28" height="18" fill="none" stroke="#7a5830" stroke-width=".8" opacity=".25" rx="1"/>
  <line x1="38" y1="80" x2="60" y2="80" stroke="#7a5830" stroke-width=".5" opacity=".2"/>
  <line x1="38" y1="84" x2="56" y2="84" stroke="#7a5830" stroke-width=".5" opacity=".2"/>
  <line x1="38" y1="88" x2="58" y2="88" stroke="#7a5830" stroke-width=".5" opacity=".2"/>
</svg>
</div>
<h3>C3. 横向投递缝</h3>
<p>正面横向窄缝，像传统信箱的投信口</p>
</div>

<!-- C4: 双色箱体 -->
<div class="col">
<div class="box-wrap">
<svg viewBox="0 0 140 130" width="135" height="125">
  <ellipse cx="70" cy="125" rx="52" ry="5" fill="rgba(0,0,0,.12)"/>
  <!-- 下半部分深色 -->
  <rect x="15" y="70" width="80" height="43" fill="#a8845a" stroke="#7a5830" stroke-width="2" rx="2"/>
  <!-- 上半部分浅色 -->
  <rect x="15" y="28" width="80" height="42" fill="#d4b07a" stroke="#7a5830" stroke-width="2" rx="2"/>
  <!-- 右侧面 -->
  <path d="M95 28 L118 20 L118 106 L95 113 Z" fill="#b8895a" stroke="#7a5830" stroke-width="2"/>
  <path d="M95 70 L118 62" stroke="#7a5830" stroke-width="1.5" opacity=".5"/>
  <!-- 顶面 -->
  <path d="M15 28 L95 28 L118 20 L38 20 Z" fill="#e0c898" stroke="#7a5830" stroke-width="2"/>
  <!-- 窄缝 -->
  <rect x="92" y="50" width="10" height="45" fill="#1a1208" rx="1"/>
  <rect x="92" y="49" width="10" height="3" fill="#0d0805"/>
  <!-- 瓦楞纹 -->
  <line x1="20" y1="85" x2="90" y2="85" stroke="#7a5830" stroke-width=".5" opacity=".12"/>
  <line x1="20" y1="100" x2="90" y2="100" stroke="#7a5830" stroke-width=".5" opacity=".12"/>
  <!-- 分界线 -->
  <line x1="15" y1="70" x2="95" y2="70" stroke="#7a5830" stroke-width="1" opacity=".3"/>
  <!-- 胶带 -->
  <rect x="53" y="20" width="3" height="93" fill="#e0c898" opacity=".4" stroke="#7a5830" stroke-width=".5" stroke-dasharray="2 2"/>
</svg>
</div>
<h3>C4. 双色箱体</h3>
<p>上半浅色下半深色，右侧窄缝，层次分明</p>
</div>

<!-- C5: 带把手 -->
<div class="col">
<div class="box-wrap">
<svg viewBox="0 0 140 135" width="135" height="130">
  <ellipse cx="70" cy="130" rx="52" ry="5" fill="rgba(0,0,0,.12)"/>
  <rect x="15" y="33" width="80" height="85" fill="#c9a063" stroke="#7a5830" stroke-width="2" rx="2"/>
  <path d="M95 33 L118 25 L118 111 L95 118 Z" fill="#b8895a" stroke="#7a5830" stroke-width="2"/>
  <path d="M15 33 L95 33 L118 25 L38 25 Z" fill="#d4b07a" stroke="#7a5830" stroke-width="2"/>
  <!-- 顶部把手 -->
  <path d="M50 25 L50 15 Q55 10 60 15 L60 25" fill="none" stroke="#7a5830" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 窄缝 -->
  <rect x="92" y="50" width="10" height="50" fill="#1a1208" rx="1"/>
  <rect x="92" y="49" width="10" height="3" fill="#0d0805"/>
  <!-- 瓦楞纹 -->
  <line x1="20" y1="50" x2="90" y2="50" stroke="#a07840" stroke-width=".5" opacity=".15"/>
  <line x1="20" y1="65" x2="90" y2="65" stroke="#a07840" stroke-width=".5" opacity=".15"/>
  <line x1="20" y1="80" x2="90" y2="80" stroke="#a07840" stroke-width=".5" opacity=".15"/>
  <line x1="20" y1="95" x2="90" y2="95" stroke="#a07840" stroke-width=".5" opacity=".15"/>
  <!-- 胶带 -->
  <rect x="53" y="25" width="3" height="93" fill="#e0c898" opacity=".4" stroke="#7a5830" stroke-width=".5" stroke-dasharray="2 2"/>
  <!-- "FRAGILE" 标签 -->
  <rect x="30" y="70" width="30" height="16" fill="none" stroke="#c0392b" stroke-width="1" opacity=".4" rx="2"/>
  <text x="45" y="80" text-anchor="middle" font-size="5" fill="#c0392b" opacity=".5" font-weight="bold">FRAGILE</text>
</svg>
</div>
<h3>C5. 带把手</h3>
<p>顶部提手+窄缝开口+红色FRAGILE标签</p>
</div>

<!-- C6: 极简信箱 -->
<div class="col">
<div class="box-wrap">
<svg viewBox="0 0 140 130" width="135" height="125">
  <ellipse cx="70" cy="125" rx="52" ry="5" fill="rgba(0,0,0,.1)"/>
  <rect x="15" y="30" width="82" height="83" fill="#c9a063" stroke="#7a5830" stroke-width="1.8" rx="3"/>
  <path d="M97 30 L120 22 L120 105 L97 113 Z" fill="#b08458" stroke="#7a5830" stroke-width="1.8"/>
  <path d="M15 30 L97 30 L120 22 L38 22 Z" fill="#d4b07a" stroke="#7a5830" stroke-width="1.8"/>
  <!-- 极窄缝 -->
  <rect x="94" y="52" width="8" height="50" fill="#0d0805" rx="1"/>
  <!-- 上沿阴影 -->
  <rect x="94" y="51" width="8" height="2" fill="#000"/>
  <!-- 胶带 -->
  <line x1="55" y1="22" x2="57" y2="113" stroke="#7a5830" stroke-width="1" opacity=".25" stroke-dasharray="3 2"/>
  <!-- 边缘高光 -->
  <line x1="17" y1="32" x2="17" y2="111" stroke="#e0c898" stroke-width="1" opacity=".3"/>
  <line x1="17" y1="32" x2="95" y2="32" stroke="#e0c898" stroke-width="1" opacity=".2"/>
</svg>
</div>
<h3>C6. 极简信箱</h3>
<p>无标签无瓦楞纹，仅胶带线+极窄缝+边缘高光</p>
</div>

</div>
</body>
</html>
