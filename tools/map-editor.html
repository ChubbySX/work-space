<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地图标记编辑器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: #f7f0e7; color: #333; padding: 16px; }
.app { max-width: 1200px; margin: 0 auto; }
h1 { font-size: 1.3rem; margin-bottom: 8px; }
.steps { background: #fffbf4; border-radius: 10px; padding: 12px 16px; margin-bottom: 14px;
  font-size: .82rem; line-height: 1.7; border: 1px solid #e8d5c0; }
.steps b { color: #c96a2e; }
.steps code { background: #f0e4d4; padding: 1px 5px; border-radius: 4px; font-size: .8rem; }

/* 两栏布局 */
.main-layout { display: flex; gap: 16px; align-items: flex-start; }
.map-col { flex: 0 0 60%; }
.side-col { flex: 1; min-width: 0; max-height: 80vh; overflow-y: auto; }

/* 地图区域 */
.map-box { position: relative; display: inline-block; max-width: 100%; line-height: 0;
  border-radius: 10px; overflow: hidden; box-shadow: 0 6px 20px rgba(96,58,22,.15); }
.map-box img { display: block; max-width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
.pin {
  position: absolute; transform: translate(-50%, -50%);
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: .85rem; font-weight: 700; color: #fff;
  border: 3px solid #fff; box-shadow: 0 3px 10px rgba(0,0,0,.35);
  cursor: grab; z-index: 2; touch-action: none; transition: transform .15s;
  line-height: 1;
}
.pin:hover { transform: translate(-50%, -50%) scale(1.15); }
.pin.dragging { cursor: grabbing; transform: translate(-50%, -50%) scale(1.25); z-index: 10; }
.pin-info {
  position: absolute; bottom: calc(100% + 5px); left: 50%; transform: translateX(-50%);
  white-space: nowrap; font-size: .68rem; font-weight: 600; color: #333;
  background: #fff; padding: 3px 8px; border-radius: 5px;
  box-shadow: 0 2px 6px rgba(0,0,0,.2); pointer-events: none; line-height: 1.4; text-align: center;
}

/* 侧边栏 */
.side-col h2 { font-size: .95rem; margin-bottom: 10px; color: #c96a2e; }
.marker-list { display: flex; flex-direction: column; gap: 10px; }
.mcard { background: #fffbf4; border: 1px solid #e8d5c0; border-radius: 10px; overflow: hidden; }
.mcard-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; cursor: pointer; }
.mcard-num { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: .75rem; font-weight: 700; color: #fff; flex-shrink: 0; }
.mcard-icon { font-size: 1rem; flex-shrink: 0; }
.mcard-name { font-size: .85rem; font-weight: 600; flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mcard-pos { font-size: .68rem; color: #999; flex-shrink: 0; }
.mcard-toggle { width: 24px; height: 24px; border: none; background: transparent; cursor: pointer;
  font-size: .8rem; color: #999; transition: transform .2s; }
.mcard.expanded .mcard-toggle { transform: rotate(180deg); }
.mcard-del { width: 24px; height: 24px; border: none; background: #e8554e; color: #fff;
  border-radius: 50%; cursor: pointer; font-size: .7rem; flex-shrink: 0; }
.mcard-del:hover { opacity: .8; }
.mcard-body { display: none; padding: 0 12px 12px; border-top: 1px solid #f0e4d4; }
.mcard.expanded .mcard-body { display: block; }
.field { margin-top: 10px; }
.field label { display: block; font-size: .72rem; color: #888; margin-bottom: 4px; }
.field input[type="text"], .field input[type="color"], .field textarea {
  width: 100%; font-family: inherit; font-size: .82rem;
  border: 1.5px solid #e0d0c0; border-radius: 6px; padding: 6px 8px; background: #fff; color: #333;
}
.field input[type="color"] { width: 40px; height: 32px; padding: 2px; cursor: pointer; }
.field-row { display: flex; gap: 10px; align-items: flex-end; }
.field-row .field { flex: 1; }
.color-row { display: flex; gap: 8px; align-items: center; }
.color-row input[type="text"] { flex: 1; }
.color-row input[type="color"] { width: 38px; height: 34px; border: 1.5px solid #e0d0c0; border-radius: 6px; padding: 2px; }
.field textarea { resize: vertical; min-height: 60px; font-family: "Consolas", monospace; font-size: .75rem; }

.add-btn { margin-top: 10px; width: 100%; padding: 10px; border: 2px dashed #c96a2e;
  background: transparent; color: #c96a2e; font-size: .85rem; border-radius: 10px; cursor: pointer;
  transition: background .2s; }
.add-btn:hover { background: #c96a2e10; }

/* 底部工具栏 */
.toolbar { margin: 16px 0; display: flex; gap: 8px; flex-wrap: wrap; }
button.btn { padding: 10px 18px; border: none; border-radius: 8px; background: #c96a2e;
  color: #fff; font-size: .9rem; cursor: pointer; transition: opacity .2s; }
button.btn:hover { opacity: .85; }
button.btn.secondary { background: #5b8a8c; }
.json-box { width: 100%; height: 200px; font-family: "Consolas", monospace; font-size: .75rem;
  border: 2px solid #e0d0c0; border-radius: 8px; padding: 10px; background: #fffbf4;
  color: #555; resize: vertical; }
.hint { font-size: .75rem; color: #999; margin-top: 6px; }

@media (max-width: 768px) {
  .main-layout { flex-direction: column; }
  .map-col { flex: none; width: 100%; }
  .side-col { max-height: 60vh; }
}
</style>
</head>
<body>
<div class="app">
  <h1>🗺️ 地图标记编辑器</h1>
  <div class="steps">
    <b>使用方法：</b><br>
    1. 在地图上拖拽编号标记到正确位置（支持触屏）<br>
    2. 在右侧编辑锚点信息（名称、描述、颜色、图标、照片路径）<br>
    3. 点「+ 添加锚点」新增，点「✕」删除锚点<br>
    4. 完成后点「📋 复制 JSON」，粘贴到 <code>content/map-markers.json</code><br>
    5. 双击「发布上线.bat」重新构建并上线
  </div>

  <div class="main-layout">
    <div class="map-col">
      <div class="map-box" id="mapBox">
        <img src="../content/map/qingdao-map.jpg" id="mapImg" alt="青岛地图" draggable="false">
      </div>
    </div>
    <div class="side-col">
      <h2>锚点列表</h2>
      <div class="marker-list" id="markerList"></div>
      <button class="add-btn" onclick="addMarker()">+ 添加锚点</button>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn" onclick="copyJSON()">📋 复制 JSON</button>
    <button class="btn secondary" onclick="downloadJSON()">💾 下载文件</button>
    <button class="btn secondary" onclick="importJSON()">📥 导入 JSON</button>
    <button class="btn secondary" onclick="resetAll()">↺ 重置全部</button>
  </div>
  <textarea class="json-box" id="jsonOutput" readonly></textarea>
  <div class="hint">↑ 实时输出标记数据，复制后粘贴到 content/map-markers.json。也可点「导入」从下方粘贴的 JSON 加载。</div>
  <textarea class="json-box" id="jsonInput" placeholder='粘贴 JSON 到这里，然后点「导入 JSON」...' style="height:100px;margin-top:8px;"></textarea>
</div>

<script>
/* ── 默认标记（与 content/map-markers.json 同步） ── */
var DEFAULT_MARKERS = [
  { "name": "青岛理工大学", "desc": "我的大学 · 智能制造工程", "x": 42, "y": 30, "color": "#c96a2e", "icon": "🎓", "photos": [
    "content/daily/青岛在青理/校园晚霞.jpg",
    "content/daily/青岛在青理/图书馆前的大广场.jpg",
    "content/daily/青岛在青理/大海在头顶.jpg",
    "content/daily/青岛在青理/天空分层.jpg",
    "content/daily/青岛在青理/操场与晴天.jpg",
    "content/daily/青岛在青理/下雪了？.jpg",
    "content/daily/青岛在青理/狗学长们爱晒太阳.jpg",
    "content/daily/青岛在青理/窗外风景（我真的很喜欢在走廊的窗户上趴着仰望外面）.jpg"
  ] },
  { "name": "栈桥", "desc": "青岛的标志 · 回澜阁", "x": 36, "y": 52, "color": "#5b8a8c", "icon": "🌉", "photos": [] },
  { "name": "五四广场", "desc": "红色雕塑「五月的风」", "x": 50, "y": 54, "color": "#d94a3a", "icon": "🌀", "photos": [] },
  { "name": "八大关", "desc": "万国建筑博览", "x": 42, "y": 50, "color": "#8a7a5a", "icon": "🏛️", "photos": [] },
  { "name": "崂山风景区", "desc": "海上第一名山", "x": 76, "y": 42, "color": "#5a9e3a", "icon": "⛰️", "photos": [] },
  { "name": "金沙滩", "desc": "亚洲第一滩", "x": 22, "y": 62, "color": "#e8b840", "icon": "🏖️", "photos": [] }
];

var MARKERS = JSON.parse(JSON.stringify(DEFAULT_MARKERS));
var expandedIdx = -1;
var dragPin = null;

/* ── 渲染地图上的锚点 ── */
function renderPins() {
  var box = document.getElementById("mapBox");
  box.querySelectorAll(".pin").forEach(function(p) { p.remove(); });
  MARKERS.forEach(function(m, i) {
    var pin = document.createElement("div");
    pin.className = "pin";
    pin.style.left = m.x + "%";
    pin.style.top = m.y + "%";
    pin.style.background = m.color;
    pin.dataset.idx = i;
    pin.innerHTML = (i + 1) + '<div class="pin-info">' + m.icon + " " + m.name +
      "<br>x:" + m.x + "% &nbsp;y:" + m.y + "%</div>";
    pin.addEventListener("mousedown", startDrag);
    pin.addEventListener("touchstart", startDrag, { passive: false });
    box.appendChild(pin);
  });
  updateJSON();
}

/* ── 渲染右侧锚点列表 ── */
function renderSidebar() {
  var list = document.getElementById("markerList");
  list.innerHTML = "";
  MARKERS.forEach(function(m, i) {
    var card = document.createElement("div");
    card.className = "mcard" + (expandedIdx === i ? " expanded" : "");
    card.dataset.idx = i;

    var photosText = (m.photos || []).join("\n");

    card.innerHTML =
      '<div class="mcard-head" onclick="toggleExpand(' + i + ')">' +
        '<span class="mcard-num" style="background:' + m.color + '">' + (i + 1) + '</span>' +
        '<span class="mcard-icon">' + m.icon + '</span>' +
        '<span class="mcard-name">' + escHtml(m.name) + '</span>' +
        '<span class="mcard-pos" id="pos' + i + '">x:' + m.x + '% y:' + m.y + '%</span>' +
        '<button class="mcard-toggle">▼</button>' +
        '<button class="mcard-del" onclick="event.stopPropagation();deleteMarker(' + i + ')">✕</button>' +
      '</div>' +
      '<div class="mcard-body">' +
        '<div class="field">' +
          '<label>名称</label>' +
          '<input type="text" value="' + escAttr(m.name) + '" oninput="updateField(' + i + ',\'name\',this.value)">' +
        '</div>' +
        '<div class="field">' +
          '<label>描述</label>' +
          '<input type="text" value="' + escAttr(m.desc) + '" oninput="updateField(' + i + ',\'desc\',this.value)">' +
        '</div>' +
        '<div class="field">' +
          '<label>图标（emoji）</label>' +
          '<input type="text" value="' + escAttr(m.icon) + '" oninput="updateField(' + i + ',\'icon\',this.value)" style="width:60px">' +
        '</div>' +
        '<div class="field">' +
          '<label>颜色</label>' +
          '<div class="color-row">' +
            '<input type="color" value="' + m.color + '" oninput="updateField(' + i + ',\'color\',this.value)">' +
            '<input type="text" value="' + escAttr(m.color) + '" oninput="updateField(' + i + ',\'color\',this.value)">' +
          '</div>' +
        '</div>' +
        '<div class="field">' +
          '<label>照片路径（每行一个，相对网站根目录）</label>' +
          '<textarea oninput="updatePhotos(' + i + ',this.value)" placeholder="content/daily/...">' + escHtml(photosText) + '</textarea>' +
        '</div>' +
      '</div>';
    list.appendChild(card);
  });
}

/* ── 展开/收起卡片 ── */
function toggleExpand(idx) {
  expandedIdx = (expandedIdx === idx) ? -1 : idx;
  renderSidebar();
}

/* ── 添加锚点 ── */
function addMarker() {
  MARKERS.push({
    name: "新锚点",
    desc: "点击编辑描述",
    x: 50, y: 50,
    color: "#c96a2e",
    icon: "📍",
    photos: []
  });
  expandedIdx = MARKERS.length - 1;
  renderPins();
  renderSidebar();
}

/* ── 删除锚点 ── */
function deleteMarker(idx) {
  MARKERS.splice(idx, 1);
  if (expandedIdx === idx) expandedIdx = -1;
  else if (expandedIdx > idx) expandedIdx--;
  renderPins();
  renderSidebar();
}

/* ── 更新字段 ── */
function updateField(idx, field, value) {
  if (!MARKERS[idx]) return;
  MARKERS[idx][field] = value;
  if (field === "name" || field === "icon" || field === "color") {
    renderPins();
    renderSidebar(); // 刷新头部显示
  } else {
    updateJSON();
  }
}

/* ── 更新照片列表 ── */
function updatePhotos(idx, text) {
  if (!MARKERS[idx]) return;
  MARKERS[idx].photos = text.split("\n").map(function(s) { return s.trim(); }).filter(Boolean);
  updateJSON();
}

/* ── 拖拽处理 ── */
function startDrag(e) {
  e.preventDefault();
  e.stopPropagation();
  dragPin = e.currentTarget;
  dragPin.classList.add("dragging");
  document.addEventListener("mousemove", onDrag);
  document.addEventListener("mouseup", endDrag);
  document.addEventListener("touchmove", onDrag, { passive: false });
  document.addEventListener("touchend", endDrag);
}

function onDrag(e) {
  if (!dragPin) return;
  e.preventDefault();
  var box = document.getElementById("mapBox");
  var rect = box.getBoundingClientRect();
  var cx = e.clientX, cy = e.clientY;
  if (e.touches && e.touches.length) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
  var x = Math.max(0, Math.min(100, Math.round((cx - rect.left) / rect.width * 100)));
  var y = Math.max(0, Math.min(100, Math.round((cy - rect.top) / rect.height * 100)));
  var idx = parseInt(dragPin.dataset.idx);
  MARKERS[idx].x = x;
  MARKERS[idx].y = y;
  dragPin.style.left = x + "%";
  dragPin.style.top = y + "%";
  var info = dragPin.querySelector(".pin-info");
  if (info) info.innerHTML = MARKERS[idx].icon + " " + MARKERS[idx].name +
    "<br>x:" + x + "% &nbsp;y:" + y + "%";
  // 更新侧边栏位置显示
  var posEl = document.getElementById("pos" + idx);
  if (posEl) posEl.textContent = "x:" + x + "% y:" + y + "%";
  updateJSON();
}

function endDrag() {
  if (dragPin) dragPin.classList.remove("dragging");
  dragPin = null;
  document.removeEventListener("mousemove", onDrag);
  document.removeEventListener("mouseup", endDrag);
  document.removeEventListener("touchmove", onDrag);
  document.removeEventListener("touchend", endDrag);
}

/* ── JSON 输出 ── */
function updateJSON() {
  document.getElementById("jsonOutput").value = JSON.stringify(MARKERS, null, 2);
}

function copyJSON() {
  var ta = document.getElementById("jsonOutput");
  ta.select();
  try { document.execCommand("copy"); alert("✅ 已复制！\n\n请打开 content/map-markers.json 全选粘贴"); }
  catch (e) { ta.select(); alert("复制失败，请手动选中文本框内容复制"); }
}

function downloadJSON() {
  var blob = new Blob([JSON.stringify(MARKERS, null, 2) + "\n"], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "map-markers.json";
  a.click();
}

function importJSON() {
  var text = document.getElementById("jsonInput").value.trim();
  if (!text) { alert("请先在下方文本框粘贴 JSON"); return; }
  try {
    var parsed = JSON.parse(text);
    if (!Array.isArray(parsed)) throw new Error("JSON 不是数组");
    MARKERS = parsed.map(function(m) {
      return {
        name: String(m.name || ""),
        desc: String(m.desc || ""),
        x: Number(m.x) || 50,
        y: Number(m.y) || 50,
        color: String(m.color || "#c96a2e"),
        icon: String(m.icon || ""),
        photos: Array.isArray(m.photos) ? m.photos.map(String) : []
      };
    });
    expandedIdx = -1;
    renderPins();
    renderSidebar();
    alert("✅ 已导入 " + MARKERS.length + " 个锚点");
  } catch (e) {
    alert("❌ JSON 解析失败：" + e.message);
  }
}

function resetAll() {
  if (!confirm("确定重置为默认锚点？当前编辑将丢失。")) return;
  MARKERS = JSON.parse(JSON.stringify(DEFAULT_MARKERS));
  expandedIdx = -1;
  renderPins();
  renderSidebar();
}

/* ── HTML 转义 ── */
function escHtml(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function escAttr(s) { return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ── 初始化 ── */
var img = document.getElementById("mapImg");
if (img.complete && img.naturalWidth > 0) { renderPins(); renderSidebar(); }
else img.addEventListener("load", function() { renderPins(); renderSidebar(); });
</script>
</body>
</html>
