<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#222236">
<title>上传器</title>
<style>
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Microsoft YaHei",sans-serif;background:#222236;color:#eee;padding:14px}
h1{font-size:17px;margin:0 0 12px}
.cfg{margin-bottom:12px}
.cfg input{width:100%;padding:8px;border:1px solid #444;border-radius:6px;background:#1a1a2a;color:#eee;box-sizing:border-box;margin-top:4px}
label{font-size:12px;color:#9aa}
.pick{display:block;margin:14px 0;padding:18px;border:2px dashed #555;border-radius:10px;text-align:center;color:#9aa}
.pick input{display:none}
.row{background:#1a1a2a;border:1px solid #333;border-radius:8px;padding:10px;margin:10px 0}
.row img{max-width:100%;max-height:160px;border-radius:6px;display:block;margin-bottom:8px}
.row input[type=text]{width:100%;padding:8px;border:1px solid #444;border-radius:6px;background:#222236;color:#eee;box-sizing:border-box}
.row select{width:100%;padding:8px;border:1px solid #444;border-radius:6px;background:#222236;color:#eee;box-sizing:border-box;margin-top:6px}
.row .newtag{margin-top:6px;display:none}
.row button{margin-top:8px;width:100%;padding:10px;border:none;border-radius:6px;background:#3a5;color:#fff;font-size:14px}
.row button:disabled{background:#455}
.row.done{opacity:.6}
.row .st{font-size:12px;margin-top:6px}
.st.ok{color:#5ad676}.st.fail{color:#e85555}.st.pend{color:#e8b442}
.toolbar{display:flex;gap:8px;margin:14px 0 4px;position:sticky;top:10px;z-index:5;background:#222236;padding:8px;border:1px solid #333;border-radius:8px}
.toolbar select{flex:1;padding:9px;border:1px solid #444;border-radius:6px;background:#1a1a2a;color:#eee;min-width:0}
.toolbar .allbtn{padding:9px 14px;border:none;border-radius:6px;background:#3a5;color:#fff;font-size:14px;font-weight:600;white-space:nowrap}
.toolbar .allbtn:active{background:#2d8f49}
</style>
</head>
<body>
<h1>📷 上传到网站</h1>
<div class="cfg">
  <label>桥接地址</label>
  <input id="url" placeholder="http://192.168.x.x:8390">
  <label style="margin-top:8px;display:block">Token</label>
  <input id="tok" type="password" placeholder="token">
</div>
<label class="pick">选择 / 拍照<input type="file" accept="image/*" multiple id="file"></label>
<div id="stage"></div>
<script src="app.js"></script>
</body>
</html>
