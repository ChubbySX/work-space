<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#222236">
<title>上传器</title>
<style>
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Microsoft YaHei",sans-serif;background:#222236;color:#eee;padding:14px}
h1{font-size:17px;margin:0 0 12px}
.cfg{margin-bottom:12px}
.cfg input{width:100%;padding:8px;border:1px solid #444;border-radius:6px;background:#1a1a2a;color:#eee;box-sizing:border-box;margin-top:4px}
label{font-size:12px;color:#9aa}
.sitesel{display:flex;gap:8px;margin-bottom:12px}
.sitesel button{flex:1;padding:10px;border:1px solid #444;border-radius:8px;background:#1a1a2a;color:#9aa;font-size:14px;cursor:pointer}
.sitesel button.on{background:#3a5;color:#fff;border-color:#3a5;font-weight:600}
.pick{display:block;margin:14px 0;padding:18px;border:2px dashed #555;border-radius:10px;text-align:center;color:#9aa}
.pick input{display:none}
.row{background:#1a1a2a;border:1px solid #333;border-radius:8px;padding:10px;margin:10px 0}
.row img,.row video{max-width:100%;max-height:160px;border-radius:6px;display:block;margin-bottom:8px}
.row input[type=text],.row select{width:100%;padding:8px;border:1px solid #444;border-radius:6px;background:#222236;color:#eee;box-sizing:border-box}
.row select{margin-top:6px}
.row .cl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px}
.row .cl .newtag{flex:1;min-width:120px;display:none}
.covchk{display:inline-flex;align-items:center;gap:4px;margin:0;font-size:12px;color:#9aa;cursor:pointer;white-space:nowrap}
.covchk input{accent-color:#3a5;margin:0}
.cov{display:none}
.cov img{width:44px;height:44px;object-fit:cover;border-radius:6px;vertical-align:middle}
.row .prog{height:6px;background:#333;border-radius:3px;margin-top:8px;overflow:hidden}
.row .prog i{display:block;height:100%;width:0;background:#3a5;transition:width .15s}
.row button{margin-top:8px;width:100%;padding:10px;border:none;border-radius:6px;background:#3a5;color:#fff;font-size:14px}
.row button:disabled{background:#455}
.row.done{opacity:.6}
.row .st{font-size:12px;margin-top:6px}
.st.ok{color:#5ad676}.st.fail{color:#e85555}.st.pend{color:#e8b442}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px;position:sticky;top:10px;z-index:5;background:#222236;padding:8px;border:1px solid #333;border-radius:8px}
.toolbar select{flex:1;min-width:120px;padding:9px;border:1px solid #444;border-radius:6px;background:#1a1a2a;color:#eee}
.toolbar input{flex:1;min-width:90px;padding:9px;border:1px solid #444;border-radius:6px;background:#1a1a2a;color:#eee;box-sizing:border-box}
.toolbar button{padding:9px 12px;border:none;border-radius:6px;background:#345;color:#fff;font-size:13px}
.toolbar .allbtn{background:#3a5;font-weight:600;white-space:nowrap}
.toolbar .allbtn:active{background:#2d8f49}
.pubchk{display:inline-flex;align-items:center;gap:7px;padding:9px 10px;border:1px solid #444;border-radius:6px;background:#1a1a2a;color:#cde;font-size:13px;cursor:pointer;white-space:nowrap}
.pubchk input{accent-color:#3a5;margin:0;width:auto;height:auto}
.pubchk.on{border-color:#3a5;background:rgba(70,170,85,.14);color:#8ee09c}
#autoSt{font-size:12px;margin:8px 0 0;color:#9aa}
.tabs{display:flex;gap:8px;margin:14px 0 4px}
.tabs button{flex:1;padding:10px;border:1px solid #444;border-radius:8px;background:#1a1a2a;color:#9aa;font-size:14px}
.tabs button.on{background:#3a5;color:#fff;border-color:#3a5;font-weight:600}
.cmd{background:#1a1a2a;border:1px solid #333;border-radius:8px;padding:10px;margin:12px 0}
.cmd textarea{width:100%;padding:8px;border:1px solid #444;border-radius:6px;background:#222236;color:#eee;box-sizing:border-box;resize:vertical;min-height:64px;font:inherit}
.cmd .cmdrow{display:flex;gap:8px;margin-top:8px}
.cmd button{flex:1;padding:11px;border:none;border-radius:6px;background:#3a5;color:#fff;font-size:15px;font-weight:600}
.cmd button:disabled{background:#455}
.cmd .cmdNoteBtn{background:#345;font-weight:400;font-size:13px}
.cmd .st{font-size:12px;margin-top:6px;min-height:16px}
.h-item .h-name{font-weight:600;font-size:14px}
.h-item .h-meta{font-size:12px;color:#9aa;margin-top:2px}
.empty{text-align:center;color:#9aa;padding:30px 0;font-size:13px}
</style>
</head>
<body>
<h1>📷 上传到网站</h1>
<div class="sitesel" id="siteSel"></div>
<div class="cfg">
  <label>桥接地址</label>
  <input id="url" placeholder="http://192.168.x.x:8390">
  <label style="margin-top:8px;display:block">Token</label>
  <input id="tok" type="password" placeholder="token">
</div>
<div class="toolbar">
  <select id="applyAll"><option value="" disabled selected>相册应用到全部…</option></select>
  <input id="prefix" placeholder="批量前缀，如 周末">
  <button id="nameAll">批量命名</button>
  <button id="allBtn" class="allbtn" disabled>全部上传（0）</button>
  <label class="pubchk" id="pubLbl" title="勾选后：本批传完自动处理并推送到 GitHub 上线；不勾选：只处理存到本地网站"><input type="checkbox" id="pubChk">推新至线上</label>
</div>
<div class="st" id="autoSt"></div>
<div class="cmd">
  <label>给电脑发指令 / 请求发布</label>
  <textarea id="cmdTxt" placeholder="把额外的提示词、指令、要求写在这里，比如：发布现在的内容、把某张照片归到新相册、给某某配个文案…（留空也可以，只发发布）"></textarea>
  <div class="cmdrow">
    <button id="cmdBtn">🚀 发布网站（带备注）</button>
    <button id="cmdNoteBtn" class="cmdNoteBtn">📤 仅发指令</button>
  </div>
  <div class="cmdrow">
    <button id="polishBtn" class="polishBtn">✨ 润色 AI 草稿</button>
  </div>
  <div class="st" id="cmdSt"></div>
  <div class="st" id="polishSt"></div>
</div>
<div class="tabs">
  <button id="tabUp" class="on">⬆ 上传</button>
  <button id="tabHist">📜 历史</button>
</div>
<div id="stage"></div>
<div id="hist" hidden></div>
<label class="pick">选择 / 拍照 / 录视频<input type="file" accept="image/*,video/*" multiple id="file"></label>
<script src="app.js"></script>
</body>
</html>
